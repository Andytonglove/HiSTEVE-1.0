# Start with a furnace, iron ore and oak planks for the alternative-fuel task.
defaults:
  - base
  - _self_

seed: 260916
random_tp_range: 1000
start_time: 1000
candidate_preferred_spawn_biome:
  - plains

task_conf:
  - name: "longbench_v1"
    text: "Smelt one iron ingot without using coal, selecting another fuel available in the world."

reward_conf:
  - event: "craft_item"
    objects: ["iron_ingot"]
    reward: 1.0
    identity: "iron_ingot"
    max_reward_times: 1

init_inventory:
  - slot: 0
    type: "furnace"
    quantity: 1
  - slot: 1
    type: "iron_ore"
    quantity: 1
  - slot: 2
    type: "oak_planks"
    quantity: 4

mobs: []
command:
  - "/time set day"
  # Load the controlled chunk before fill commands target it.
  - "/tp @p 31.5 80 62.5 180 0"
  - "/fill 28 78 55 35 79 66 minecraft:grass_block"
  - "/fill 29 80 56 34 84 65 minecraft:air"

need_crafting_table: False
need_gui: False
