[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "histeve-core"
version = "0.1.0"
description = "An agent harness for long-horizon Minecraft tasks with native VLA control"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.package-data]
"histeve.minecraft" = ["subtasks.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["histeve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py310"
